<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Halaman Tidak Ditemukan &middot; SiPosya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --border:#ebedf0;
    --border-strong:#e1e4e8;
    --text:#14161a;
    --text-2:#5b626e;
    --text-3:#8a909c;
    --accent:#0f9d7a;
    --accent-weak:#e7f6f1;
    --accent-ink:#0b7a5f;
    --green:#15a05a;--green-bg:#e8f6ed;
    --amber:#c77a16;--amber-bg:#fbf1e1;
    --red:#d64545;--red-bg:#fbeaea;
    --blue:#3a6ff0;--blue-bg:#eaf0fe;
    --radius:16px;--radius-sm:10px;--radius-xs:8px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
    --shadow-md:0 4px 16px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;letter-spacing:-.01em;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .top-strip{
    padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#fff;
  }
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
  .brand .logo{
    width:36px;height:36px;border-radius:10px;flex-shrink:0;background:linear-gradient(145deg,var(--accent),#0bbf90);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 10px rgba(15,157,122,.28);
  }
  .brand .name{font-weight:700;font-size:15px;letter-spacing:-.02em}
  .brand .sub{font-size:11px;color:var(--text-3)}

  .center-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:44px 36px;max-width:520px;width:100%;text-align:center;box-shadow:var(--shadow-md);
  }
  .error-code{
    font-size:72px;font-weight:800;letter-spacing:-.04em;line-height:1;
    background:linear-gradient(135deg,var(--accent),#0b8a6a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:12px;
  }
  h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
  p{font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:28px}

  .btn-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;
    border-radius:var(--radius-sm);font-weight:600;font-size:13px;cursor:pointer;border:1px solid transparent;text-decoration:none;
  }
  .btn.primary{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(15,157,122,.25)}
  .btn.ghost{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
</style>
</head>
<body>

<header class="top-strip">
  <a href="../umum/landing.html" class="brand">
    <div class="logo">S</div>
    <div>
      <div class="name">SiPosya</div>
      <div class="sub">Posyandu Kartini IV A</div>
    </div>
  </a>
  <a href="../index.html" style="font-size:12.5px;color:var(--text-2);text-decoration:none;font-weight:500">&larr; Daftar 33 Halaman</a>
</header>

<div class="center-wrap">
  <div class="card">
    <div class="error-code">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>
      Mohon maaf, tautan yang Anda buka tidak tersedia atau telah dipindahkan ke alamat lain. Silakan kembali ke menu dashboard utama.
    </p>

    <div class="btn-row">
      <a href="../peserta/peserta-dashboard.html" class="btn ghost">Dashboard Peserta</a>
      <a href="../kader/home.html" class="btn primary">Dashboard Kader &rarr;</a>
    </div>
  </div>
</div>

</body>
</html>
